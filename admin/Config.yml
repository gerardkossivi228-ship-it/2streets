# ==========================================================
# 2 STREET
# Decap CMS Configuration
# ==========================================================


# ==========================================================
# CONNEXION À GITHUB VIA NETLIFY
# ==========================================================

backend:
  name: git-gateway
  branch: main


# ==========================================================
# IMAGES
# ==========================================================

# Les photos prises/sélectionnées depuis le téléphone
# seront enregistrées ici dans GitHub.

media_folder: "assets/uploads"

# Adresse utilisée par le site pour afficher les photos.

public_folder: "/assets/uploads"


# ==========================================================
# LANGUE
# ==========================================================

locale: "fr"


# ==========================================================
# PRODUITS 2 STREET FASHION
# ==========================================================

collections:

  - name: "fashion"
    label: "👕 2 STREET FASHION"
    label_singular: "Vêtement"

    # Les produits seront enregistrés ici :
    folder: "content/products/fashion"

    # Autorise la création de nouveaux produits
    create: true

    # Le nom du fichier sera basé sur le nom du produit
    slug: "{{slug}}"

    fields:

      # ====================================================
      # NOM
      # ====================================================

      - label: "Nom du vêtement"
        name: "title"
        widget: "string"
        hint: "Exemple : Hoodie 2 STREET"


      # ====================================================
      # PRIX
      # ====================================================

      - label: "Prix (FCFA)"
        name: "price"
        widget: "number"
        value_type: "int"
        min: 0
        hint: "Exemple : 35000"


      # ====================================================
      # PHOTO
      # ====================================================

      - label: "Photo du vêtement"
        name: "image"
        widget: "image"
        choose_url: false
        allow_multiple: false


      # ====================================================
      # DESCRIPTION
      # ====================================================

      - label: "Description"
        name: "description"
        widget: "text"
        required: false
        hint: "Décris le vêtement, sa matière, son style, etc."


      # ====================================================
      # CATÉGORIE
      # ====================================================

      - label: "Catégorie"
        name: "category"
        widget: "select"

        options:

          - label: "T-Shirt"
            value: "t-shirt"

          - label: "Hoodie"
            value: "hoodie"

          - label: "Pantalon"
            value: "pantalon"

          - label: "Cargo"
            value: "cargo"

          - label: "Veste"
            value: "veste"

          - label: "Short"
            value: "short"

          - label: "Casquette"
            value: "casquette"

          - label: "Accessoire"
            value: "accessoire"

          - label: "Autre"
            value: "autre"


      # ====================================================
      # TAILLES
      # ====================================================

      - label: "Tailles disponibles"
        name: "sizes"
        widget: "select"
        multiple: true

        options:
          - "S"
          - "M"
          - "L"
          - "XL"
          - "XXL"

        required: false


      # ====================================================
      # COULEURS
      # ====================================================

      - label: "Couleurs disponibles"
        name: "colors"
        widget: "list"
        required: false

        field:
          label: "Couleur"
          name: "color"
          widget: "string"


      # ====================================================
      # STOCK
      # ====================================================

      - label: "Stock disponible"
        name: "stock"
        widget: "number"
        value_type: "int"
        min: 0
        default: 0


      # ====================================================
      # PRODUIT MIS EN AVANT
      # ====================================================

      - label: "Afficher dans les produits vedettes"
        name: "featured"
        widget: "boolean"
        default: falsek


      # ====================================================
      # BOUTIQUE
      # ====================================================

      - label: "Boutique"
        name: "branch"
        widget: "hidden"
        default: "fashion"
